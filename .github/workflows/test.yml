name: Test using pytest

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [  "3.11" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for PySide6 (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[test]"

      - name: Automated tests with Pytest (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run pytest

      - name: Automated tests with Pytest (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      # The image tests always write the rendered PNG next to its baseline
      # as *_actual.png. Publishing them on failure lets a legitimate visual
      # change be reviewed and committed as the new baseline straight from
      # the canonical runner, without a local Linux environment.
      - name: Upload rendered images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-images-${{ matrix.os }}
          path: '**/tests/baseline/*_actual.png'
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.os }}
          path: coverage.xml
